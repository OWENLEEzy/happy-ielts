[project]
name = "dynamiclingo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langsmith>=0.3.4",
    "langgraph>=1.0,<2.0",
    "deepagents",
    "langchain-community>=0.4.0,<0.5.0",
    "notebooklm-py[browser]",
    "langchain-tavily>=0.1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "scrapling",
    "fsrs",
    "python-dotenv",
    "httpx[socks]",
    "dashscope>=1.25.14",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "trafilatura>=2.0.0",
    "langchain-openai>=0.3.0",
    "apscheduler>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "langsmith[pytest]",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "mypy",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
check_untyped_defs = true
exclude = ["frontend/", ".venv/"]

[[tool.mypy.overrides]]
module = "backend.models"
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
]
