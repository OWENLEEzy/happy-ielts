const Reading = () => {
    const navigate = useNavigate();
    const [progress,      setProgress]     = useState(0);
    const [activeVocab,   setActiveVocab]  = useState(null);
    const [showTip,       setShowTip]      = useState(true);
    const scrollRef = useRef(null);

    useEffect(() => {
        const el = scrollRef.current;
        if (!el) return;
        const onScroll = () => {
            const pct = Math.min(100, Math.round(el.scrollTop / (el.scrollHeight - el.clientHeight) * 100));
            setProgress(isNaN(pct) ? 0 : pct);
        };
        el.addEventListener('scroll', onScroll);
        return () => el.removeEventListener('scroll', onScroll);
    }, []);

    /* Highlight vocab words inside a paragraph */
    const renderPara = (text) => {
        const tokens = text.split(/(\s+)/);
        return tokens.map((token, i) => {
            const clean = token.replace(/[.,;"()]/g, '').toLowerCase();
            const vocabItem = ARTICLE.vocab.find(v => v.word === clean);
            if (vocabItem) {
                return (
                    <span key={i}>
                        <span
                            className="vocab-word cursor-pointer relative"
                            onClick={() => setActiveVocab(av => av?.word === vocabItem.word ? null : vocabItem)}
                        >{token}</span>
                        {activeVocab?.word === vocabItem.word && (
                            <span className="inline-flex ml-1 bg-on-surface text-background text-xs rounded-lg px-3 py-1.5 font-label shadow-xl align-middle z-10">
                                {vocabItem.phonetic} · {vocabItem.def}
                            </span>
                        )}
                    </span>
                );
            }
            return <span key={i}>{token}</span>;
        });
    };

    return (
        <div className="min-h-screen bg-background flex flex-col">
            <Header />
            {/* Thin progress bar below header */}
            <div className="h-1 bg-primary-container/20 sticky top-[57px] z-40">
                <div id="read-progress-bar" className="h-full bg-primary rounded-r-full" style={{width:`${progress}%`}} />
            </div>

            <div className="flex flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 gap-8 pb-20 md:pb-8" ref={scrollRef} style={{overflowY:'auto', maxHeight:'calc(100vh - 72px)'}}>

                {/* Article main column */}
                <article className="flex-1 min-w-0 space-y-6">
                    {/* Meta */}
                    <div>
                        <div className="flex flex-wrap gap-2 mb-4">
                            <span className="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold font-label">🌿 Environment</span>
                            <span className="bg-tertiary/10 text-tertiary px-3 py-1 rounded-full text-xs font-bold font-label">{ARTICLE.difficulty}</span>
                            <span className="bg-surface-container-high text-on-surface-variant px-3 py-1 rounded-full text-xs font-bold font-label flex items-center gap-1">
                                <Icon name="schedule" size={13} />{ARTICLE.readTime}
                            </span>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-extrabold font-headline text-on-surface mb-2">{ARTICLE.title}</h1>
                        <p className="text-on-surface-variant text-lg leading-relaxed mb-4">{ARTICLE.subtitle}</p>
                        <div className="flex items-center gap-2 text-xs text-on-surface-variant font-label">
                            <Icon name="smart_toy" fill size={14} cls="text-primary" />
                            AI 已高亮 3 个核心段落 ·
                            <span className="text-primary font-bold">{ARTICLE.vocab.length} 个关键词</span>已添加生词库
                        </div>
                    </div>

                    {/* Tutor tip */}
                    {showTip && (
                        <div className="bg-tertiary-container/25 border border-primary/10 rounded-lg p-4 flex items-start gap-3">
                            <div className="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 border-2 border-primary/20">
                                <img src={DOG_GOLDEN} className="w-full h-full object-cover" alt="Tutor" />
                            </div>
                            <div className="flex-1">
                                <div className="text-[11px] font-black text-primary uppercase tracking-wider font-label mb-1">Professor 金毛提示</div>
                                <p className="text-sm text-on-surface leading-relaxed">注意<span className="font-bold text-primary">紫色高亮段落</span>——这些是今日写作任务的核心论点来源。<span className="font-semibold underline decoration-dotted decoration-primary cursor-help">点击蓝色词汇</span>可查看释义。</p>
                            </div>
                            <button onClick={() => setShowTip(false)} className="text-on-surface-variant hover:text-on-surface mt-0.5">
                                <Icon name="close" size={17} />
                            </button>
                        </div>
                    )}

                    {/* Paragraphs */}
                    <div className="space-y-5 text-base leading-8 text-on-surface">
                        {ARTICLE.paragraphs.map(p => (
                            <p key={p.id} className={`${p.highlight ? 'ai-highlight relative pl-4' : ''}`}>
                                {p.highlight && <span className="absolute left-0 top-1 bottom-1 w-1 bg-primary rounded-full opacity-70" />}
                                {renderPara(p.text)}
                            </p>
                        ))}
                    </div>

                    {/* Vocab list */}
                    <div className="pt-8 border-t border-outline-variant/20">
                        <div className="flex items-center gap-2 mb-5">
                            <Icon name="style" fill size={20} cls="text-primary" />
                            <h2 className="text-lg font-bold font-headline text-on-surface">本文关键词汇</h2>
                        </div>
                        <div className="grid sm:grid-cols-2 gap-3">
                            {ARTICLE.vocab.map(v => (
                                <div key={v.word} className="bg-surface-container-low rounded-lg p-4 border border-outline-variant/10">
                                    <div className="flex items-baseline gap-2 mb-1">
                                        <span className="font-bold text-primary font-headline text-base">{v.word}</span>
                                        <span className="text-xs text-on-surface-variant font-label">{v.phonetic}</span>
                                    </div>
                                    <p className="text-sm text-on-surface-variant">{v.def}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* CTA */}
                    <div className="bg-primary-container/20 rounded-lg p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <div className="text-[11px] font-black text-primary uppercase tracking-widest font-label mb-1">文章阅读完成 🎉</div>
                            <h3 className="text-lg font-bold font-headline text-on-surface">准备好写作了吗？</h3>
                            <p className="text-sm text-on-surface-variant mt-1">基于本文的写作任务已就绪，250词，建议25分钟</p>
                        </div>
                        <div className="flex items-center gap-3 flex-shrink-0">
                            <div className="hidden sm:block w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-md">
                                <img src={DOG_TOGETHER} className="w-full h-full object-cover" alt="完成" />
                            </div>
                            <button onClick={() => navigate('/writing')}
                                className="signature-gradient text-white px-6 py-2.5 rounded-full font-bold text-sm shadow-lg shadow-primary/25 hover:scale-105 transition-transform flex items-center gap-2 font-label whitespace-nowrap">
                                <Icon name="edit_note" size={18} />开始写作
                            </button>
                        </div>
                    </div>
                </article>

                {/* Right sidebar */}
                <aside className="hidden xl:flex flex-col gap-5 w-60 flex-shrink-0 sticky top-4 h-fit">
                    <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                        <div className="text-[11px] font-black text-primary uppercase tracking-widest mb-2 font-label">阅读进度</div>
                        <div className="text-4xl font-black font-headline text-on-surface mb-2">{progress}%</div>
                        <div className="h-2 bg-primary-container/20 rounded-full overflow-hidden">
                            <div className="h-full bg-primary rounded-full transition-all duration-500" style={{width:`${progress}%`}} />
                        </div>
                    </div>
                    <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                        <div className="text-[11px] font-black text-primary uppercase tracking-widest mb-3 font-label">学习检查点</div>
                        {[
                            { label:"识别主要论点",   done: progress > 15 },
                            { label:"理解3个核心词",  done: progress > 40 },
                            { label:"完成全文阅读",   done: progress >= 90 },
                            { label:"完成写作任务",   done: false          },
                        ].map(g => (
                            <div key={g.label} className="flex items-center gap-2.5 py-2">
                                <div className={`w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors ${g.done ? 'bg-primary border-primary' : 'border-outline-variant'}`}>
                                    {g.done && <Icon name="check" fill size={12} cls="text-white" />}
                                </div>
                                <span className={`text-xs font-label ${g.done ? 'line-through text-on-surface-variant' : 'text-on-surface'}`}>{g.label}</span>
                            </div>
                        ))}
                    </div>
                    <div className="bg-secondary-container/30 rounded-lg p-4 border border-dashed border-primary/15">
                        <div className="flex items-center gap-2 mb-2">
                            <div className="w-7 h-7 rounded-full overflow-hidden border border-primary/20">
                                <img src={DOG_GOLDEN} className="w-full h-full object-cover" alt="tutor" />
                            </div>
                            <span className="text-[10px] font-black text-primary font-label uppercase tracking-wider">Professor 金毛</span>
                        </div>
                        <p className="text-xs text-on-surface leading-relaxed italic">"第5段中 'Achilles' heel' 是固定搭配，写作时用它替换 'weakness' 可大幅提升词汇评分！"</p>
                    </div>
                </aside>
            </div>
            <MobileNav />
        </div>
    );
};

const Writing = () => {
    const navigate = useNavigate();
    const [text,       setText]       = useState('');
    const [streaming,  setStreaming]   = useState(false);
    const [submitted,  setSubmitted]   = useState(false);
    const [feedback,   setFeedback]    = useState(null);

    const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const MIN = 250;

    const handleSubmit = () => {
        setStreaming(true);
        setTimeout(() => {
            setStreaming(false);
            setSubmitted(true);
            setFeedback({
                overall: 7.0,
                scores:  { task:7.0, coherence:7.5, vocab:6.5, grammar:7.0 },
                strengths: [
                    "论点结构清晰，主题句定位准确",
                    "正确使用了 'intrinsic value' 和 'mitigation'",
                ],
                chinglish: [
                    { wrong:"very importance",       correct:"of great importance / critically important" },
                    { wrong:"have a big influence to", correct:"have a significant influence on"          },
                ],
                suggestion: "建议在第2段加入具体数据（如新加坡案例），词汇分数可提升至7.5+。",
            });
        }, 2600);
    };

    const reset = () => { setText(''); setSubmitted(false); setFeedback(null); setStreaming(false); };

    return (
        <div className="min-h-screen bg-background pb-20 md:pb-0">
            <Header />
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                <div className="grid lg:grid-cols-5 gap-8 items-start">

                    {/* Writing panel */}
                    <div className="lg:col-span-3 space-y-5">

                        {/* Prompt */}
                        <div className="bg-surface-container-lowest rounded-lg p-6 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                            <div className="flex items-center gap-2 mb-3">
                                <span className="signature-gradient text-white text-xs font-black px-3 py-1 rounded-full font-label">Task 2</span>
                                <span className="text-xs text-on-surface-variant font-label">250词最低 · 建议25分钟</span>
                            </div>
                            <p className="text-on-surface leading-relaxed font-medium">"{WRITING_PROMPT}"</p>
                            <div className="mt-4 grid sm:grid-cols-3 gap-2">
                                {[
                                    "先表明立场，再展开论据",
                                    "可引用今日文章中的案例",
                                    "检查逻辑词：however / therefore",
                                ].map((tip, i) => (
                                    <div key={i} className="bg-surface-container-low rounded-lg p-3 text-xs text-on-surface-variant leading-relaxed">
                                        <Icon name="tips_and_updates" fill size={13} cls="text-primary mb-1 block" />
                                        {tip}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {!submitted ? (
                            /* Editor */
                            <div className="bg-surface-container-lowest rounded-lg p-6 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                                <textarea
                                    className="w-full rounded-lg border border-outline-variant/20 bg-surface-container-low p-5 resize-none focus:outline-none focus:ring-2 focus:ring-primary/20 placeholder:text-on-surface-variant/40 text-on-surface leading-8 font-body text-sm"
                                    rows={13}
                                    placeholder="在此输入你的文章... (至少250词)"
                                    value={text}
                                    onChange={e => setText(e.target.value)}
                                    disabled={streaming}
                                />
                                <div className="mt-4 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <span className="text-sm font-bold font-label">
                                            <span className={wordCount >= MIN ? 'text-primary' : wordCount > 200 ? 'text-on-surface' : 'text-on-surface-variant'}>{wordCount}</span>
                                            <span className="text-on-surface-variant"> / {MIN} 词</span>
                                        </span>
                                        <div className="w-20 h-2 bg-primary-container/20 rounded-full overflow-hidden">
                                            <div className={`h-full rounded-full transition-all duration-300 ${wordCount >= MIN ? 'bg-primary' : 'bg-primary/40'}`}
                                                style={{width:`${Math.min(100, (wordCount/MIN)*100)}%`}} />
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleSubmit}
                                        disabled={wordCount < MIN || streaming}
                                        className={`flex items-center gap-2 px-6 py-2.5 rounded-full font-bold text-sm font-label transition-all
                                            ${wordCount >= MIN && !streaming
                                                ? 'signature-gradient text-white shadow-lg shadow-primary/25 hover:scale-105 cursor-pointer'
                                                : 'bg-surface-container-highest text-on-surface-variant cursor-not-allowed opacity-60'}`}
                                    >
                                        {streaming ? (
                                            <>
                                                <span className="flex gap-1">
                                                    {[0,1,2].map(i => <span key={i} className={`w-2 h-2 bg-white rounded-full inline-block ${['dot1','dot2','dot3'][i]}`} />)}
                                                </span>

                                            <><Icon name="send" size={17} />提交批改</>

                            <div className="space-y-4">

                                        <div className="w-16 h-16 rounded-full overflow-hidden border-2 border-white/30 flex-shrink-0">
                                            <img src={DOG_TOGETHER} className="w-full h-full object-cover" alt="完成！" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-4 gap-2 relative z-10">
                                        {[
                                            { k:"task",      label:"任务", v:feedback.scores.task      },
                                            { k:"coherence", label:"衔接", v:feedback.scores.coherence },
                                            { k:"vocab",     label:"词汇", v:feedback.scores.vocab     },
                                            { k:"grammar",   label:"语法", v:feedback.scores.grammar   },
                                        ].map(s => (
                                            <div key={s.k} className="bg-white/15 backdrop-blur-sm rounded-lg p-3 text-center">
                                                <div className="text-xl font-black font-headline">{s.v}</div>

                                <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                                    <div className="flex items-center gap-2 mb-4">
                                        <Icon name="thumb_up" fill size={19} cls="text-primary" />
                                        <span className="font-bold font-headline text-on-surface">做得好的地方</span>
                                    </div>
                                    {feedback.strengths.map((s, i) => (
                                        <div key={i} className="flex items-start gap-3 py-2.5 border-b border-outline-variant/10 last:border-0">

                                    <div>
                                        <div className="text-[11px] font-black text-primary uppercase tracking-wider font-label mb-1">Professor 金毛建议</div>

                                    </button>
                                    <button onClick={() => navigate('/vocab')}
                                        className="flex-1 signature-gradient text-white py-3 rounded-full font-bold text-sm font-label hover:scale-105 transition-transform shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
                                        <Icon name="style" size={17} />复习新词 ({feedback.chinglish.length})
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Reference sidebar */}
                    <aside className="lg:col-span-2 space-y-5 sticky top-24 h-fit">
                        <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                            <div className="flex items-center justify-between mb-4">
                                <span className="font-bold font-headline text-on-surface text-sm">文章核心观点</span>
                                <button onClick={() => {}} className="text-primary text-xs font-label font-bold hover:underline flex items-center gap-0.5">
                                    返回全文 <Icon name="arrow_forward_ios" size={11} />
                                </button>
                            </div>
                            {ARTICLE.paragraphs.filter(p => p.highlight).map(p => (
                                <div key={p.id} className="border-l-4 border-primary pl-4 py-2 mb-4 last:mb-0">
                                    <p className="text-xs text-on-surface leading-relaxed line-clamp-3">{p.text}</p>
                                </div>
                            ))}
                        </div>

                        <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                            <div className="font-bold font-headline text-on-surface text-sm mb-4">可用高级词汇</div>
                            <div className="flex flex-wrap gap-2">
                                {[...ARTICLE.vocab, ...VOCAB_ITEMS.slice(0,2)].map(v => (
                                    <span key={v.word} className="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold font-label cursor-pointer hover:bg-primary/20 transition-colors">
                                        {v.word}
                                    </span>
                                ))}
                            </div>
                        </div>

                        <div className="signature-gradient rounded-lg p-5 text-white relative overflow-hidden shadow-lg">
                            <div className="absolute -bottom-4 -right-4 opacity-10 pointer-events-none">
                                <Icon name="pets" fill size={80} cls="text-white" />
                            </div>
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 border border-white/30">
                                    <img src={DOG_GOLDEN} className="w-full h-full object-cover" alt="tutor" />
                                </div>
                                <span className="text-[11px] font-black font-label uppercase tracking-wider opacity-80">Professor 金毛的写作公式</span>
                            </div>
                            <p className="text-sm leading-relaxed opacity-90">
                                引言 (1段) → 支持论点 (2段) → 反对论点 (1段) → 总结 (1段)。每段都要有<span className="font-black">主题句 + 例证 + 小结</span>。
                            </p>
                        </div>
                    </aside>
                </div>
            </main>
            <MobileNav />
        </div>
    );
};

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: Vocab
// ═══════════════════════════════════════════════════════════════════════════════
const Vocab = () => {
    const navigate  = useNavigate();
    const [idx,      setIdx]       = useState(0);
    const [flipped,  setFlipped]   = useState(false);
    const [done,     setDone]      = useState([]);   // [{word, difficulty}]

    const current   = VOCAB_ITEMS[idx];
    const completed = done.length === VOCAB_ITEMS.length;

    const rate = (difficulty) => {
        setDone(prev => [...prev, { word: current.word, difficulty }]);
        setFlipped(false);
        if (idx + 1 < VOCAB_ITEMS.length) {
            setTimeout(() => setIdx(i => i + 1), 320);
        }
    };

    const ratingBtns = [
        { label:"记不住", emoji:"😰", val:"hard",    style:"bg-error/10 text-error border border-error/20 hover:bg-error/20"                                     },
        { label:"模糊",   emoji:"🤔", val:"medium",  style:"bg-tertiary/10 text-tertiary border border-tertiary/20 hover:bg-tertiary/20"                          },
        { label:"清楚",   emoji:"😊", val:"easy",    style:"bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20"                              },
        { label:"滚瓜烂熟", emoji:"🐾", val:"perfect","style":"signature-gradient text-white shadow-lg shadow-primary/25 hover:opacity-95"                         },
    ];

    return (
        <div className="min-h-screen bg-background pb-20 md:pb-0">
            <Header />
            <main className="max-w-3xl mx-auto px-4 sm:px-6 py-8">

                {/* Header row */}
                <div className="flex items-center justify-between mb-6">
                    <div>
                        <h1 className="text-2xl font-bold font-headline text-on-surface">间隔复习</h1>
                        <p className="text-on-surface-variant text-sm font-label mt-0.5">今日待复习 · {VOCAB_ITEMS.length} 个生词</p>
                    </div>
                    <div className="text-right">
                        <div className="text-3xl font-black text-primary font-headline leading-none">
                            {done.length}<span className="text-base font-semibold text-on-surface-variant">/{VOCAB_ITEMS.length}</span>
                        </div>
                        <div className="text-xs text-on-surface-variant font-label">已完成</div>
                    </div>
                </div>

                {/* Progress bar */}
                <div className="h-2.5 bg-primary-container/20 rounded-full mb-8 overflow-hidden">
                    <div className="h-full bg-primary rounded-full transition-all duration-500" style={{width:`${(done.length / VOCAB_ITEMS.length) * 100}%`}} />
                </div>

                {!completed ? (
                    <div className="space-y-6">
                        {/* Flashcard */}
                        <div className="perspective h-72 cursor-pointer" onClick={() => setFlipped(f => !f)}>
                            <div className={`flashcard w-full h-full ${flipped ? 'flipped' : ''}`}>
                                {/* Front */}
                                <div className="card-face bg-surface-container-lowest rounded-lg shadow-[0_8px_32px_rgba(109,74,179,0.12)] flex flex-col items-center justify-center p-8 text-center">
                                    <div className={`text-[11px] font-black uppercase tracking-widest mb-4 font-label px-3 py-1 rounded-full ${current.source === 'writing_error' ? 'bg-error/10 text-error' : 'bg-primary/10 text-primary'}`}>
                                        {current.source === 'writing_error' ? '🚩 写作错误来源' : '📖 阅读高亮'}
                                    </div>
                                    <div className="text-5xl font-black font-headline text-on-surface mb-3">{current.word}</div>
                                    <div className="text-on-surface-variant font-label text-sm mb-6">{current.phonetic} · {current.pos}</div>
                                    <div className="flex items-center gap-2 text-xs text-on-surface-variant font-label">
                                        <Icon name="touch_app" size={16} />点击翻转查看释义
                                    </div>
                                </div>
                                {/* Back */}
                                <div className="card-face card-back signature-gradient rounded-lg shadow-xl flex flex-col justify-between p-7 text-white">
                                    <div>
                                        <div className="text-2xl font-black font-headline mb-1">{current.word}</div>
                                        <div className="text-sm opacity-75 mb-4 font-label">{current.phonetic} · {current.pos}</div>
                                        <div className="bg-white/20 rounded-lg p-4 text-base font-medium mb-4">{current.def}</div>
                                        <p className="text-sm opacity-90 border-l-2 border-white/30 pl-3 italic leading-relaxed">"{current.example}"</p>
                                    </div>
                                    {current.chinglish && (
                                        <div className="bg-white/15 rounded-lg p-3 mt-3">
                                            <Icon name="flag" fill size={13} cls="text-white mr-1 align-text-bottom" />
                                            <span className="text-xs font-bold font-label">{current.chinglish}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Rating buttons — only after flip */}
                        {flipped && (
                            <div className="grid grid-cols-4 gap-2">
                                {ratingBtns.map(btn => (
                                    <button key={btn.val} onClick={() => rate(btn.val)}
                                        className={`${btn.style} rounded-lg py-3.5 flex flex-col items-center gap-1.5 transition-all hover:scale-105 font-label`}>
                                        <span className="text-2xl">{btn.emoji}</span>
                                        <span className="text-xs font-bold">{btn.label}</span>
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* Word list */}
                        <div className="bg-surface-container-lowest rounded-lg p-5 shadow-[0_4px_16px_rgba(109,74,179,0.07)]">
                            <div className="font-bold font-headline text-on-surface mb-4 text-sm">今日词单</div>
                            <div className="space-y-1">
                                {VOCAB_ITEMS.map((v, i) => {
                                    const isDone = done.find(d => d.word === v.word);
                                    const isCur  = i === idx && !completed;
                                    return (
                                        <div key={v.id} className={`flex items-center gap-3 py-2.5 px-3 rounded-lg transition-colors ${isCur ? 'bg-primary/10' : 'hover:bg-surface-container-low'}`}>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black flex-shrink-0 font-label ${isDone ? 'bg-primary text-white' : isCur ? 'bg-primary/20 text-primary' : 'bg-surface-container-high text-on-surface-variant'}`}>
                                                {isDone ? '✓' : i + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <span className="font-bold text-sm text-on-surface font-label">{v.word}</span>
                                                <span className="text-xs text-on-surface-variant ml-2 hidden sm:inline">{v.def}</span>
                                            </div>
                                            {v.source === 'writing_error' && <Icon name="flag" fill size={14} cls="text-error flex-shrink-0" />}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                ) : (
                    /* Completion */
                    <div className="text-center py-12 space-y-6">
                        <div className="w-36 h-36 rounded-full overflow-hidden border-4 border-primary shadow-xl mx-auto">
                            <img src={DOG_TOGETHER} className="w-full h-full object-cover" alt="完成！" />
                        </div>
                        <div>
                            <h2 className="text-3xl font-black font-headline text-on-surface mb-2">今日复习完成！🎉</h2>
                            <p className="text-on-surface-variant">{VOCAB_ITEMS.length} 个生词已复习，明日安排已更新。</p>
                        </div>
                        <div className="grid grid-cols-3 gap-4 max-w-xs mx-auto">
                            {[
                                { label:"记不住", count:done.filter(d => d.difficulty==='hard').length,    color:"text-error"   },
                                { label:"清楚",   count:done.filter(d => d.difficulty==='easy').length,    color:"text-primary" },
                                { label:"滚瓜烂熟", count:done.filter(d => d.difficulty==='perfect').length, color:"text-primary" },
                            ].map(s => (
                                <div key={s.label} className="bg-surface-container-lowest rounded-lg p-4 shadow-sm">
                                    <div className={`text-2xl font-black font-headline ${s.color}`}>{s.count}</div>
                                    <div className="text-xs text-on-surface-variant font-label">{s.label}</div>
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-3 justify-center">
                            <button onClick={() => { setIdx(0); setDone([]); setFlipped(false); }}
                                className="bg-surface-container-highest text-on-surface px-6 py-2.5 rounded-full font-bold text-sm font-label hover:bg-surface-variant transition-colors flex items-center gap-2">
                                <Icon name="refresh" size={17} />再来一遍
                            </button>
                            <button onClick={() => navigate('/dashboard')}
                                className="signature-gradient text-white px-6 py-2.5 rounded-full font-bold text-sm font-label shadow-lg shadow-primary/25 hover:scale-105 transition-transform flex items-center gap-2">
                                <Icon name="home" size={17} />返回首页
                            </button>
                        </div>
                    </div>
                )}
            </main>
            <MobileNav />
        </div>
    );
};

// ─── App ─────────────────────────────────────────────────────────────────────
const App = () => (
    <MemoryRouter initialEntries={['/dashboard']}>
        <Routes>
            <Route path="/dashboard" element={<Dashboard />} />
            <Route path="/reading"   element={<Reading />}   />
            <Route path="/writing"   element={<Writing />}   />
            <Route path="/vocab"     element={<Vocab />}     />
        </Routes>
    </MemoryRouter>
);

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
